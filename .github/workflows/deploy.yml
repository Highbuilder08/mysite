name: Django CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy to Django servers
        shell: bash
        run: |
          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "sudo -u ubuntu -H bash -lc 'cd /home/ubuntu/djangowork/mysite && git fetch origin && git reset --hard origin/main'",
              "systemctl restart gunicorn",
              "systemctl is-active gunicorn",
              "sudo -u ubuntu -H bash -lc 'cd /home/ubuntu/djangowork/mysite && git log --oneline -1'"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids \
              "i-0e89dbf8f16d159c1" \
              "i-0ac49f0e4bfc7aad5" \
            --parameters file:///tmp/ssm-params.json \
            --comment "GitHub Actions Django deployment" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for INSTANCE_ID in \
            i-0e89dbf8f16d159c1 \
            i-0ac49f0e4bfc7aad5
          do
            echo "Waiting for $INSTANCE_ID..."

            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"

            echo "===== $INSTANCE_ID RESULT ====="

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{
                Status:Status,
                Output:StandardOutputContent,
                Error:StandardErrorContent
              }'
          done